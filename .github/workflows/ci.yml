name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-test:
    name: build + test
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@v6

      # Self-hosted runners: put the SDK under the runner account's home, which it can always write,
      # never in the system install (which it cannot).
      - name: Choose where setup-dotnet installs
        if: runner.environment == 'self-hosted'
        run: echo "DOTNET_INSTALL_DIR=$HOME/.dotnet" >> "$GITHUB_ENV"
      # Install the SDK in the job instead of trusting the runner's: every build then bundles the
      # current runtime whichever runner picked it up. It also sets DOTNET_ROOT, which the xUnit v3
      # / MTP test apphosts need to find the runtime.
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          cache: ${{ runner.environment == 'github-hosted' }}
          cache-dependency-path: Directory.Packages.props
      # The integration tests run Testcontainers, so they need a Docker daemon this account can reach.
      - name: Check the tools this job needs
        run: scripts/ci-require-tools.sh docker:docker.io

      - name: build
        run: dotnet build Axcall.slnx --nologo

      # Runs unit + integration tests. The integration tests require Docker
      # (Testcontainers spins up net-sim + LinBPQ); the runner is expected to
      # have it, and the suite fails loudly if it doesn't.
      #
      # Category=Peers is excluded: that is the on-demand suite against other
      # implementations, run with scripts/peer-interop.sh when the IP code
      # changes or a peer is updated. The reason it is not here is not cost.
      # Its kernel leg cannot run in a container at all, because AF_AX25 is
      # refused inside a non-init user namespace and this runner is one, so a
      # peer suite CI could run in full does not exist. See docs/ip-over-ax25.md.
      - name: test
        run: dotnet test tests/Axcall.Tests/Axcall.Tests.csproj --nologo --no-build --filter "Category!=Peers"
